<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick | Archivo</title>

  <script>
    (function() {
      var saved = localStorage.getItem("ricstars_theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="icon" href="assets/img/web/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <button type="button" id="themeToggle" class="icon-btn theme-toggle-fixed" aria-label="Cambiar tema claro/oscuro"></button>

  <header class="profile-header">
    <div class="profile-content">
      <div class="profile-photo-wrap">
        <img src="assets/img/web/profile.png" alt="Rick" class="profile-photo">
      </div>
      <div class="profile-info">
        <h1 class="profile-name">яicᴋ</h1>
        <p class="profile-handle">@xrhxnox</p>
        <p class="profile-bio">Tratando de matar el tiempo</p>
        <div class="status-badge" id="statusBadge" hidden></div>
        <p class="profile-stats" id="profileStats" hidden></p>
        <div class="header-actions">
          <a class="icon-btn" href="https://x.com/xrhxnox" target="_blank" rel="noopener" aria-label="Sígueme en X: @xrhxnox">
            <i class="fa-brands fa-twitter"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <hr class="section-divider">

  <main>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar...">
    </div>

    <div class="controls">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="todos"><span class="filter-icon"><i class="fa-solid fa-circle-check"></i></span><span class="filter-label">Todos</span></button>
        <button class="filter-btn" data-filter="anime"><span class="filter-icon"><i class="fa-solid fa-dragon"></i></span><span class="filter-label">Anime</span></button>
        <button class="filter-btn" data-filter="pelicula"><span class="filter-icon"><i class="fa-solid fa-clapperboard"></i></span><span class="filter-label">Películas</span></button>
        <button class="filter-btn" data-filter="serie"><span class="filter-icon"><i class="fa-solid fa-tv"></i></span><span class="filter-label">Series</span></button>
        <button class="filter-btn" data-filter="trash-tv"><span class="filter-icon"><i class="fa-solid fa-trash"></i></span><span class="filter-label">Trash TV</span></button>
        <button class="filter-btn" data-filter="videojuego"><span class="filter-icon"><i class="fa-solid fa-gamepad"></i></span><span class="filter-label">Videojuegos</span></button>
        <button class="filter-btn" data-filter="libro"><span class="filter-icon"><i class="fa-solid fa-book"></i></span><span class="filter-label">Libros</span></button>
        <button class="filter-btn" data-filter="musica"><span class="filter-icon"><i class="fa-solid fa-music"></i></span><span class="filter-label">Música</span></button>
        <button class="filter-btn" data-filter="deportes"><span class="filter-icon"><i class="fa-solid fa-trophy"></i></span><span class="filter-label">Deportes</span></button>
        <button class="filter-btn" data-filter="escenciales"><span class="filter-icon"><i class="fa-solid fa-star"></i></span><span class="filter-label">Escenciales</span></button>
      </div>

      <div class="year-select">
        <label for="year">Año</label>
        <select id="year"></select>
      </div>
    </div>

    <p class="empty-state" id="emptyState" hidden>Aún no hay nada aqui lol</p>

    <section class="grid" id="grid"></section>

    <div class="pagination" id="pagination"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="copyrightYear"></span><br>Diseñado por mi</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/status.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
